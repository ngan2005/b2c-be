spring.application.name=B2C

# ============ MOCK PROFILE: H2 in-memory, no external services ============
# Usage: --spring.profiles.active=mock

# H2 In-Memory Database. JSONB domain is mapped to JSON so Flyway scripts that
# use jsonb columns on PostgreSQL can run unchanged here. INIT runs once per new
# in-memory database.
spring.datasource.url=jdbc:h2:mem:b2c_mock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA owns the schema in mock mode. We disable Flyway below because the
# Postgres-only syntax (ON CONFLICT, INTERVAL literals, ...) in the shared
# migration scripts does not parse on H2.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable Flyway in mock mode. The shared migration scripts target PostgreSQL
# (ON CONFLICT, INTERVAL literals, ...) and don't parse on H2. JPA creates
# the schema from entities instead.
spring.flyway.enabled=false
spring.sql.init.mode=never

# ============ JWT (any string OK for testing) ============
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# ============ Server ============
server.port=8080

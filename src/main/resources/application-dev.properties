# Development profile overrides
# NOTE: Do NOT commit credentials or production config to version control.

# Database: Supabase Tokyo transaction pooler (project ipkqyubcjvpuomnxlcuy, region ap-northeast-1).
# Direct connection db.ipkqyubcjvpuomnxlcuy.supabase.co is IPv6-only on this network
# and won't resolve, so use the transaction pooler instead. Override via env vars
# (SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / DB_PASSWORD) if needed.
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.ipkqyubcjvpuomnxlcuy
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE
# PgBouncer transaction mode resets prepared statements after each transaction.
# Flyway uses advisory locks internally with prepared statements that don't
# survive PgBouncer's connection reset, so disable Flyway's advisory lock.
spring.flyway.lock.enabled=false

# JPA - Flyway owns the schema here too, matching the default profile.
# ddl-auto=update would let Hibernate mutate tables behind Flyway's back.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Spring AI - keep OpenAI beans disabled unless an api key is supplied.
# Without this, ChatClient auto-config fails with "credential required" when
# OPENAI_API_KEY is blank and the AI controller refuses to wire up.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.enabled=${OPENAI_API_KEY:false}

# Inventory locking strategy: E0=no-lock, E1=optimistic, E2=pessimistic,
# E3=optimistic-with-retry. Used by InventoryService and integration tests.
inventory.locking.strategy=${INVENTORY_LOCKING_STRATEGY:E1}

# JWT (use a strong random key in production)
application.security.jwt.secret-key=${JWT_SECRET_KEY:4A7D1B8E9F3C2A6D5E8B1C4F7A0D3E9B2C5F8A1D4E7B0C3F6A9D2E5B8C1F4A7D0E3B6C9F2A5D8E1B4C7F0A3D6E9B2C5F8A1D}

# Admin bootstrap (PromoteAdminTool). Register this email first, then start the app
# with the dev profile to promote it. Leave the email blank to skip the tool entirely.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}

# ============ Admin email whitelist (OAuth2 auto-promote) ============
# Comma-separated list of emails that should be created/promoted with the
# ADMIN role when they sign in for the first time via Google OAuth2.
# Existing users are NOT touched by this whitelist — see
# CustomOAuth2UserService#assignRole for the rule.
# Example: ADMIN_EMAILS=alice@gmail.com,bob@gmail.com
app.oauth2.admin-emails=${ADMIN_EMAILS:}

# ============ Password Reset ============
# TTL of the password reset token in minutes.
application.security.password-reset.token-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
# Frontend URL that consumes the reset link sent in the email.
application.security.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
# Email provider: "logging" (default, dev/test) or "smtp" (real Gmail/SendGrid).
# Set to "smtp" to actually deliver email. The block below MUST be filled in
# (via env vars GMAIL_USERNAME / GMAIL_APP_PASSWORD) or startup will fail.
application.email.provider=${EMAIL_PROVIDER:logging}
# Address used as the "From" header. Defaults to the SMTP username.
application.email.from=${EMAIL_FROM:}

# SMTP — used only when application.email.provider=smtp.
# Gmail example (requires App Password, NOT the Gmail account password):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=your-address@gmail.com
#   spring.mail.password=abcdefghijklmnop   (16-char App Password, no spaces)
# Override with env vars in your shell / .env (git-ignored).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============ OAuth2 — Google ============
# Client id/secret for Google sign-in. Fallback to the literal string
# "disabled" so SecurityConfig can detect a misconfigured deployment and
# gracefully skip oauth2Login() instead of failing the whole context at
# startup. Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in your .env or
# the deployment environment to enable real Google sign-in.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
# scope is intentionally without "openid" so Spring Security does NOT wrap
# the principal in a DefaultOidcUser. We only need basic profile data; the
# JWT is issued by our own OAuth2SuccessHandler, not the OIDC ID token.
spring.security.oauth2.client.registration.google.scope=email,profile
# Where the FE expects the OAuth2 callback. Tokens are placed in the URL
# fragment (#access_token=...) so they never reach the server logs.
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# ============ Cloudinary (image storage) ============
# In dev we default provider=disabled so the BE boots without forcing
# every developer to sign up for Cloudinary. The application context
# will simply skip registering the CloudinaryStorageAdapter, and any
# upload endpoint will return 503 from the GlobalExceptionHandler.
# Flip to "cloudinary" + fill in the three keys below to enable.
app.storage.provider=${APP_STORAGE_PROVIDER:disabled}

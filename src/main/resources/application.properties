spring.application.name=B2C

# Default profile. If SPRING_PROFILES_ACTIVE is not set (env var, -D system
# property, or --spring.profiles.active=...), Spring falls back to the
# profile name below. We default to "dev" so `gradlew bootRun` boots
# against the Supabase PostgreSQL configuration in application-dev.properties
# without requiring extra flags.
spring.profiles.default=${SPRING_PROFILES_DEFAULT:dev}

# JWT (HS256, base64-encoded secret read from env via spring-dotenv)
# Override with real values in .env (which is git-ignored).
application.security.jwt.secret-key=${JWT_SECRET_KEY:}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# ============ OAuth2 ============
# The Google registration is declared in application-dev.properties.
# If neither GOOGLE_CLIENT_ID nor GOOGLE_CLIENT_SECRET is set in your
# environment/.env, Spring Security's OAuth2 auto-config is skipped and
# SecurityConfig guards oauth2Login() so the backend boots fine.
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# ============ File upload (Cloudinary backend) ============
# Enable the Cloudinary storage adapter. The provider can be swapped
# (e.g. to S3) by changing this key and adding a matching adapter.
# When set to "cloudinary" the three CLOUDINARY_* env vars MUST be set,
# otherwise the application fails fast on startup (see
# CloudinaryStorageAutoConfiguration). "disabled" is the safe default
# for local dev without a Cloudinary account.
app.storage.provider=${APP_STORAGE_PROVIDER:disabled}
# Explicitly bind CLOUDINARY_* env vars into the Spring property tree
# so the CloudinaryProperties @ConfigurationProperties bean picks them up.
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.cloudinary.folder=${CLOUDINARY_FOLDER:b2c}
app.storage.cloudinary.max-file-size-bytes=${CLOUDINARY_MAX_FILE_SIZE_BYTES:5242880}

# ============ VNPay (payment gateway) ============
# Sandbox: https://sandbox.vnpayment.vn/
# Register a merchant account to get real TMN_CODE and HASH_SECRET.
# Without them the integration code path is complete but VNPay will reject transactions.
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMO_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/return}
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.version=2.1.0
vnpay.command=pay
vnpay.locale=vn
vnpay.currency-code=VND

# Multipart limits for the upload controller. The adapter additionally
# enforces mime type + size; these values are Tomcat-level ceilings.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ============ Flyway ============
# Automatically repair the flyway_schema_history table (remove failed
# migration checksums) before each migrate so a fixed script can re-run.
spring.flyway.repair-on-migrate=true
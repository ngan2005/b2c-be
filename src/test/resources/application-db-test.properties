# In-memory H2 profile with JPA enabled — used for tests that exercise the database
# (IdempotencyServiceTest, InventoryStrategyConcurrencyTest, ...). The default
# application-test.properties excludes JPA to keep controller-only tests fast.
spring.datasource.url=jdbc:h2:mem:b2c_db_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.sql.init.mode=never

# Inventory strategy default for tests
inventory.locking.strategy=E1
